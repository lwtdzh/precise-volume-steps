plugins {
    id 'com.android.application'
}

android {
    namespace 'roro.stellar.volumesteps.compatibility'
    defaultConfig {
        // This firmware permits this prefix for background audio writes.
        // The app is an independently signed Precise Volume Steps companion.
        applicationId 'com.vivo.finevolumesteps.helper'
        minSdk 28
        targetSdk 37
        versionCode 5
        versionName '1.4'
    }
    buildFeatures {
        aidl true
    }
    sourceSets.main.aidl.srcDir '../compatibility-aidl'
    // Share the app label translations; never change the helper's runtime identity.
    sourceSets.main.res.srcDir '../localization/res'
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
