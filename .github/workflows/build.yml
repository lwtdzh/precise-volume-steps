name: Android build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify
        run: >
          ./gradlew -PvolumeStepsE2E=true
          :assembleRelease :lintRelease :testReleaseUnitTest
          :compatibility-helper:assembleRelease :compatibility-helper:lintRelease
          :precise-volume-steps-test-host:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-verification
          path: |
            build/reports/
            build/test-results/
            build/outputs/apk/release/
            compatibility-helper/build/outputs/apk/release/
          retention-days: 14
