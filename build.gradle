plugins {
    id 'com.android.application'
}

android {
    namespace 'roro.stellar.volumesteps'
    compileSdk {
        version = release(37)
    }
    buildToolsVersion = '36.0.0'
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    defaultConfig {
        applicationId 'roro.stellar.volumesteps'
        minSdk 28
        targetSdk 37
        versionCode 29
        versionName '1.5.1'
    }

    buildFeatures {
        aidl true
    }

    sourceSets.main.aidl.srcDir 'compatibility-aidl'

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'com.github.topjohnwu.libsu:core:6.0.0'
    implementation 'com.github.topjohnwu.libsu:service:6.0.0'
    testImplementation 'junit:junit:4.13.2'
}

def helperAssets = layout.buildDirectory.dir('generated/helper-assets')
tasks.register('bundleCompatibilityHelper', Copy) {
    dependsOn ':compatibility-helper:assembleRelease'
    from project(':compatibility-helper').layout.buildDirectory.file(
            'outputs/apk/release/compatibility-helper-release.apk')
    into helperAssets
    rename { 'volume-helper.apk' }
}
android.sourceSets.main.assets.srcDir(helperAssets)
tasks.named('preBuild').configure { dependsOn 'bundleCompatibilityHelper' }

subprojects {
    plugins.withId('com.android.application') {
        android {
            compileSdk {
                version = release(37)
            }
            buildToolsVersion = '36.0.0'
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}
