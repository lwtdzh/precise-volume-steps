plugins {
    id 'com.android.application'
}

android {
    namespace 'roro.stellar.volumesteps'
    compileSdk {
        version = release(37)
    }
    buildToolsVersion = '36.0.0'
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    defaultConfig {
        applicationId 'roro.stellar.volumesteps'
        minSdk 28
        targetSdk 37
        versionCode 26
        versionName '1.4.14'
    }

    buildFeatures {
        aidl true
    }

    sourceSets.main.aidl.srcDir 'compatibility-aidl'

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
}

subprojects {
    plugins.withId('com.android.application') {
        android {
            compileSdk {
                version = release(37)
            }
            buildToolsVersion = '36.0.0'
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}
